name: studplan
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
x-backend: &backend
  image: studplan-backend:local
  build:
    context: .
    dockerfile: server/Dockerfile
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-studplan}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-student_planner}?schema=public
    JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost}
    PORT: "3001"
    NODE_ENV: production
    TRUST_PROXY_HOPS: "1"
  networks: [data]
  logging: *logging
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-student_planner}
      POSTGRES_USER: ${POSTGRES_USER:-studplan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=ru-RU
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [data]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging
  migrate:
    <<: *backend
    command: [../node_modules/.bin/prisma, migrate, deploy]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  backend:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [data, web]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:2019/config/']
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging
networks:
  data:
    internal: true
  web:
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
